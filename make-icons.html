<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buat Ikon PNG</title>
<style>
  body{font-family:ui-sans-serif,-apple-system,sans-serif;background:#f4f1e8;color:#16202b;padding:24px;text-align:center;line-height:1.5}
  h2{font-family:Georgia,serif}
  p{max-width:460px;margin:12px auto}
  button{background:#c85d16;color:#fff;border:none;padding:14px 22px;border-radius:11px;font-size:16px;font-weight:800;margin:8px;cursor:pointer}
  canvas{border:1px solid #ddd;margin:14px;border-radius:16px;background:#fff}
  .ok{color:#0b6b53;font-weight:700}
</style>
</head>
<body>
  <h2>Buat Ikon PNG untuk APK</h2>
  <p>Klik <b>kedua</b> tombol di bawah untuk mengunduh <b>icon-192.png</b> dan <b>icon-512.png</b>. Setelah itu upload kedua file ini ke GitHub (folder yang sama).</p>
  <div><canvas id="prev" width="192" height="192"></canvas></div>
  <button id="b512">&#8595; Unduh icon-512.png</button>
  <button id="b192">&#8595; Unduh icon-192.png</button>
  <p id="msg"></p>
<script>
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(ctx,s){var k=s/512;ctx.clearRect(0,0,s,s);
  ctx.fillStyle="#c85d16";rr(ctx,0,0,s,s,112*k);ctx.fill();
  ctx.fillStyle="#fffdf8";rr(ctx,86*k,248*k,200*k,120*k,16*k);ctx.fill();
  ctx.beginPath();ctx.moveTo(286*k,268*k);ctx.lineTo(360*k,268*k);ctx.lineTo(406*k,320*k);ctx.lineTo(406*k,368*k);ctx.lineTo(286*k,368*k);ctx.closePath();ctx.fill();
  ctx.lineWidth=12*k;
  [[168,392],[356,392]].forEach(function(c){ctx.beginPath();ctx.arc(c[0]*k,c[1]*k,34*k,0,Math.PI*2);ctx.fillStyle="#16202b";ctx.fill();ctx.strokeStyle="#fffdf8";ctx.stroke();});
  ctx.fillStyle="#ffd34d";ctx.font="700 "+(150*k)+"px Georgia, serif";ctx.textAlign="center";ctx.textBaseline="alphabetic";ctx.fillText("Rp",256*k,190*k);
}
draw(document.getElementById("prev").getContext("2d"),192);
function dl(size,name){var c=document.createElement("canvas");c.width=c.height=size;draw(c.getContext("2d"),size);
  c.toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
    document.getElementById("msg").innerHTML='<span class="ok">'+name+' terunduh &#10003;</span>';},"image/png");}
document.getElementById("b512").onclick=function(){dl(512,"icon-512.png");};
document.getElementById("b192").onclick=function(){dl(192,"icon-192.png");};
</script>
</body>
</html>
